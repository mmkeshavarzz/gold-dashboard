name: به‌روزرسانی قیمت طلا، نقره و دلار

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/scrape_prices.py"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: دریافت قیمت‌ها
        run: |
          python scripts/scrape_prices.py

      - name: بررسی تغییرات
        id: changes
        run: |
          if git diff --quiet -- public/data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ثبت قیمت‌های جدید
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/prices.json
          git commit -m "chore: update market prices"
          git push
